<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leituras Conjuntas Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wdth,wght@62..125,400..800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&display=swap">
<style>
/* Layout: a thin demo bar on top, then one of three app screens (public page, student area, admin panel) like the real platform.
   Single deliberate look: the Academia Bocault identity v2 ("à luz de vela": a dark, candlelit reading room), the same in any viewer theme.
   The O Manto Mariano cycle keeps its own identity (.manto). */
:root {
  color-scheme: dark;
  --paper: #14100c;   /* noite */
  --card: #1f1914;    /* sépia */
  --bone: #2a221b;
  --ink: #ece2cf;     /* marfim */
  --muted: #9b9183;   /* cinza de gravura */
  --line: #3a2f25;
  --accent: #d9a75e;  /* vela */
  --accent-soft: #2b2218;
  --lapis: #f2c46b;   /* chama (hover) */
  --flame: #f2c46b;   /* the moth's flame */
  --gold: #b0743c;    /* cobre */
  --live: #9e3324;    /* sangue */
  --alert: #e08a7a;
  --ok: #d9a75e;
  --ok-soft: #2b2218;
  --warn: #9b9183;
  --warn-soft: #2a221b;
  --bar: #0c0a07;
  --manto: #1d2a64; --velino: #f2ece0; --ouro-manto: #b38f4f;
  --serif: "IM Fell English", "Garamond", Georgia, serif;
  --text: "EB Garamond", "Garamond", Georgia, serif;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --manto-serif: "Bodoni Moda", "Didot", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--text); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; }
.muted { color: var(--muted); }
.caps { text-transform: uppercase; letter-spacing: .18em; font-size: 11px; }
.num { font-variant-numeric: tabular-nums; }

/* demo bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.demobar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bar); color: #e9e1d6; }
.demobar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.demobar .tag { font-size: 12px; color: #b9ad9f; flex: 1 1 240px; min-width: 0; }
.demobar .tag b { color: var(--gold); font-weight: 600; }
.seg { display: inline-flex; background: rgba(242,236,224,.08); border-radius: 2px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: rgba(242,236,224,.75); padding: 6px 12px; border-radius: 2px; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }

/* buttons + fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 2px; background: var(--ink); color: var(--paper); padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
.btn:hover { background: #45372c; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: #b8ab9c; }
.btn.danger { background: #fbe9e7; color: var(--live); border: 1px solid #f0c4be; }
.btn.small { padding: 5px 11px; font-size: 12.5px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.field { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 2px; padding: 9px 12px; font-size: 14px; }
.field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(43,34,27,.1); }
label.lbl { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 5px; font-weight: 500; }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 2px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.p-upcoming { background: var(--accent-soft); color: var(--accent); }
.p-live { background: var(--live); color: #fff; }
.p-live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
.p-recorded { background: var(--ok-soft); color: var(--ok); }
.p-processing { background: #e6e0d8; color: var(--muted); }
.p-cancelled { background: #e6e0d8; color: var(--muted); text-decoration: line-through; }
.p-warn { background: var(--warn-soft); color: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ── public page ── */
.pub { padding-block: 28px 56px; }
.pub .top { display: flex; justify-content: flex-end; }
.hero { text-align: center; padding-block: 8px 40px; }
.avatar { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 26px; background: var(--ink); color: var(--gold); display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 40px; border: 4px solid var(--card); box-shadow: 0 6px 20px rgba(43,34,27,.18); }
.hero h1 { font-size: clamp(44px, 9vw, 72px); color: var(--accent); text-transform: uppercase; letter-spacing: .04em; line-height: .95; }
.hero .brand { margin-top: 16px; color: var(--accent); opacity: .85; }
.hero .by { margin-top: 6px; font-size: 14px; color: var(--muted); }
.hero .lede { max-width: 30em; margin: 22px auto 0; color: var(--muted); }
.offers { max-width: 680px; margin: 0 auto; display: grid; gap: 18px; }
.offer { background: var(--ink); color: var(--paper); border-radius: 2px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(43,34,27,.18); }
.offer .caps { color: var(--gold); }
.offer h2 { font-size: 32px; font-style: italic; margin-top: 10px; }
.offer .au { color: rgba(232,227,221,.6); font-size: 14px; margin-top: 4px; }
.offer p.d { max-width: 34em; margin: 14px auto 0; font-size: 14px; color: rgba(232,227,221,.8); }
.offer .ed { margin-top: 12px; font-size: 12.5px; color: rgba(232,227,221,.6); }
.offer .edlink { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; cursor: pointer; font-size: inherit; }
.offer .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px; margin-top: 18px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(232,227,221,.6); }
.offer .facts .price { color: var(--gold); }
.offer .cta { margin-top: 22px; background: var(--paper); color: var(--ink); border: 0; border-radius: 2px; padding: 11px 24px; font-size: 12px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }
.offer .cta:hover { background: #fff; }

/* ── app chrome (student) ── */
.apphead { border-bottom: 1px solid var(--line); background: rgba(232,227,221,.92); }
.apphead .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.apphead .logo { font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--accent); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apphead nav { display: flex; gap: 2px; font-size: 14px; }
.apphead nav button { background: none; border: 0; padding: 6px 10px; border-radius: 2px; cursor: pointer; }
.apphead nav button:hover { background: var(--line); }
.main { padding-block: 32px 64px; }
.crumb { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 14px; }
.crumb:hover { color: var(--ink); }

.nextbar { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; background: var(--ink); color: var(--paper); border-radius: 2px; padding: 26px; margin-top: 24px; cursor: pointer; border: 0; text-align: left; width: 100%; }
.nextbar:hover { background: #3a2e25; }
.nextbar .t { flex: 1 1 280px; min-width: 0; }
.nextbar .caps { color: rgba(232,227,221,.6); }
.nextbar h2 { font-size: 28px; margin-top: 6px; }
.nextbar .ch { color: rgba(232,227,221,.7); margin-top: 2px; }
.nextbar .when { margin-top: 10px; font-size: 14px; }
.nextbar .go { background: var(--paper); color: var(--ink); border-radius: 2px; padding: 8px 16px; font-size: 14px; font-weight: 500; }

.sect { margin-top: 44px; }
.sect > h2 { font-size: 28px; margin-bottom: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 28px 22px; }
.bookcard { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.bookcard:hover .cover { transform: translateY(-4px); }
.cover { aspect-ratio: 2/3; width: 100%; max-width: 100%; border-radius: 2px; padding: 10%; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; box-shadow: 0 8px 20px rgba(43,34,27,.25); transition: transform .2s; }
.cover.img { padding: 0; object-fit: cover; display: block; background: #fff; }
.cover.img::before { display: none; }
.cover::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6%; background: rgba(0,0,0,.2); }
.cover .rule { height: 1px; width: 34%; opacity: .6; background: currentColor; }
.cover .ti { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: clamp(18px, 2.2vw, 24px); line-height: 1.1; }
.cover .au { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.bookcard .meta { font-size: 13px; color: var(--muted); }
.bookcard .name { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.15; }
.locknote { font-size: 13px; color: var(--accent); font-weight: 500; }

.bookhead { display: grid; grid-template-columns: 200px 1fr; gap: 32px; margin-top: 22px; }
.bookhead .info { min-width: 0; }
.bookhead h1 { font-size: clamp(36px, 6vw, 48px); margin-top: 8px; }
.bookhead .au { font-size: 17px; color: var(--muted); margin-top: 4px; }
.bookhead .d { margin-top: 14px; max-width: 36em; }
.prog { max-width: 340px; margin-top: 20px; }
.prog .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.prog .track { height: 6px; background: var(--line); border-radius: 2px; }
.prog .fill { height: 100%; background: var(--accent); border-radius: 2px; }
.locked { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--accent-soft); border: 1px solid #e3c3bb; border-radius: 2px; padding: 16px 18px; font-size: 14px; }
.locked p { flex: 1 1 240px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mrow { width: 100%; display: flex; align-items: center; gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 14px 18px; text-align: left; cursor: pointer; }
.mrow:hover { border-color: #b8ab9c; }
.mrow.next { box-shadow: 0 0 0 2px rgba(92,0,0,.35); }
.mrow.nolink { cursor: default; }
.mrow .date { width: 50px; text-align: center; flex-shrink: 0; }
.mrow .date .d { font-family: var(--serif); font-size: 28px; line-height: 1; font-weight: 600; }
.mrow .date .s { font-size: 10.5px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.mrow .body { flex: 1; min-width: 0; }
.mrow .k { font-size: 12px; color: var(--muted); }
.mrow .n { font-weight: 500; }
.mrow .c { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.player { margin-top: 26px; aspect-ratio: 16/9; max-width: 100%; border-radius: 2px; background: radial-gradient(120% 90% at 30% 20%, #3a2c22, #120d0a); color: var(--paper); position: relative; display: grid; place-items: center; overflow: hidden; }
.player .play { width: 76px; height: 76px; border-radius: 50%; background: rgba(246,242,236,.95); display: grid; place-items: center; border: 0; cursor: pointer; }
.player .play::before { content: ""; border-left: 22px solid var(--ink); border-top: 13px solid transparent; border-bottom: 13px solid transparent; margin-left: 6px; }
.player .cap { position: absolute; left: 20px; bottom: 16px; right: 20px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: rgba(246,242,236,.75); flex-wrap: wrap; }
.player .bar { position: absolute; left: 20px; right: 20px; bottom: 44px; height: 3px; background: rgba(246,242,236,.2); border-radius: 2px; }
.player .bar i { display: block; width: 0; height: 100%; background: var(--gold); border-radius: 2px; }
.livebox { margin-top: 26px; border-radius: 2px; padding: 28px; background: var(--ink); color: var(--paper); }
.livebox.on { background: var(--live); }
.livebox .s { font-size: 14px; opacity: .8; }
.livebox h2 { font-size: 30px; margin-top: 4px; }
.livebox .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.livebox .acts button { border-radius: 2px; padding: 9px 18px; font-size: 14px; cursor: pointer; border: 1px solid rgba(246,242,236,.35); background: transparent; color: var(--paper); }
.livebox .acts button.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 600; }
.note { margin-top: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px; }
.files { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 2px; }
.files li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.files li:first-child { border-top: 0; }
.files .ft { width: 52px; text-align: center; background: var(--paper); color: var(--accent); border-radius: 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; padding: 2px 0; }
.files .fn { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .fa { display: flex; gap: 12px; }
.drop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border: 1px dashed #b8ab9c; border-radius: 2px; padding: 12px 14px; margin-top: 12px; font-size: 13px; color: var(--muted); background: var(--paper); }
.upbar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.upbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; }

/* ── admin ── */
.admin { display: grid; grid-template-columns: 228px 1fr; min-height: 640px; }
.side { background: var(--card); border-right: 1px solid var(--line); padding: 22px 14px; }
.side .lg { font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--accent); padding: 0 8px; }
.side .sub { font-size: 12px; color: var(--muted); padding: 0 8px; margin-bottom: 22px; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 2px; font-size: 14px; cursor: pointer; }
.side nav button:hover { background: var(--line); }
.side nav button[aria-current="page"] { background: var(--ink); color: var(--paper); }
.side nav .cnt { margin-left: auto; font-size: 11px; background: var(--accent); color: #fff; border-radius: 2px; padding: 0 7px; }
.side .foot { margin-top: 26px; padding: 14px 8px 0; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.adm { min-width: 0; padding-block: 30px 60px; }
.adm .inner { max-width: 940px; }
.ph { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 22px; }
.ph h1 { font-size: 36px; }
.ph p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.banner { border: 1px solid #e7d3a6; background: var(--warn-soft); color: #6b4a12; border-radius: 2px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 18px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 16px; }
.tile .v { font-family: var(--serif); font-size: 36px; font-weight: 600; line-height: 1.1; margin-top: 4px; }
.tile .h { font-size: 12px; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px; min-width: 0; }
.panel h2 { font-size: 23px; margin-bottom: 10px; }
.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; margin-top: 16px; }
.stack { display: grid; gap: 16px; align-content: start; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; }
.rows .tm { width: 58px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
.rows .tm b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
.rows .bd { flex: 1 1 200px; min-width: 0; }
.rows .bd .x { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .bd .y { font-size: 12.5px; color: var(--muted); }
.editor { flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end; background: var(--paper); border-radius: 2px; padding: 12px; }
.editor .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.check input { accent-color: var(--accent); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.chip { display: inline-block; background: var(--paper); border-radius: 2px; padding: 1px 9px; font-size: 12px; margin: 1px 2px 1px 0; white-space: nowrap; }
.compose { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.presets button { border: 1px solid var(--line); background: #fff; border-radius: 2px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.form { display: grid; gap: 12px; }
.toggle { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.toggle:first-child { border-top: 0; }
.toggle .t { flex: 1; min-width: 0; }
.toggle .t b { font-weight: 500; display: block; }
.toggle .t span { font-size: 13px; color: var(--muted); }
.sw { width: 44px; height: 24px; border-radius: 99px; background: #c9bfb3; border: 0; position: relative; cursor: pointer; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--ok); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }

/* e-mail preview (mirrors the real template) */
.mail { background: var(--paper); border-radius: 2px; padding: 18px; }
.mail .env { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: grid; gap: 2px; }
.mail .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 22px 24px; font-size: 14.5px; }
.mail .sheet .br { font-family: Georgia, serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.mail .sheet h3 { font-family: Georgia, serif; font-size: 21px; margin: 10px 0 12px; font-weight: 600; }
.mail .sheet p { margin-bottom: 12px; }
.mail .sheet .box { background: var(--paper); border-radius: 2px; padding: 12px 14px; margin-bottom: 12px; }

    const lista = (items) => `<ol class="sx-lista">${items.map((it, i) => `<li><span><span class="r">${roman(i + 1)}</span>${it[0]}</span><span>${it[1] || ""}</span></li>`).join("")}</ol>`;

    const periodo = (isos) => `${fmtD(isos[0])} – ${fmtD(isos[isos.length - 1])} ${isos[isos.length - 1].slice(0, 4)}`;
    const gravadas = (x) => dados([["Período", periodo(x.aulas.map((a) => a[0]))], ["Aulas", `${x.aulas.length} · ${totalH(x)} horas`], ["Formato", "Aulas gravadas"], ["Acesso", "12 meses"]])

    const f = HB.fausto, so = HB.sol, b = HB.bovary;
    // On a wide screen the book has its own column with the button under it; on a phone it sits small beside the title.
    const sec = ({ cls, right = false, cover, spine, alt, head, txt, btn, underBook = "", behindBook = "", txtCls = "", before = "", after = "" }) =>

        before: `<div class="sx-galhos" style="background-image:url('${GALHOS}')"></div>` })

  function renderPublic() {
    return `<div class="home">${hRevista()}</div>`;
  }

  // ───── student area ─────
  function studentHead() {
    return `<header class="apphead gutter"><div class="wrap">
      <div class="logo"><svg viewBox="0 0 160 124" aria-hidden="true"><use href="#marca"/></svg><span class="wm"><span class="a">ACADEMIA</span><span class="b">Bocault</span></span></div>
      <nav><button data-st="home">Livros</button><button class="hide-sm" data-toast="Nome e preferências de e-mail.">Conta</button><button data-go="publico" class="muted">Sair</button></nav>
    </div></header>`;
  }
  function renderStudentHome() {
    const mine = books.filter((b) => b.enrolled);
    // grouped like the platform: yours in progress, the finished ones (yours first), and those still to come
    const current = mine.filter((b) => b.status !== "FINISHED");
    const finished = books.filter((b) => b.status === "FINISHED").sort((a, b) => Number(b.enrolled) - Number(a.enrolled));
    const upcoming = books.filter((b) => !b.enrolled && b.status !== "FINISHED");
    const next = mine.flatMap((b) => b.meetings).filter((m) => m.status === "SCHEDULED" && m.startsAt.getTime() + m.duration * 6e4 > Date.now()).sort((a, b) => a.startsAt - b.startsAt)[0];
    const grid = (list) => `<div class="grid">${list.map((b, _, __, locked = !b.enrolled) => `
      <button class="bookcard" data-book="${b.id}">
        ${cover(b)}
        <div>${bookStatus(b)}</div>
        <div class="name">${esc(b.title)}</div>${b.id === "fausto" ? `<div class="caps" style="font-size:9px;color:var(--ouro-manto)">Ciclo O Manto Mariano</div>` : ""}
        <div class="meta">${esc(b.author)}${b.meetings.length ? ` · ${b.meetings.length} encontros` : ""}</div>
        ${locked ? `<div class="locknote">${b.signup === "OPEN" ? b.price : SIGN[b.signup][0]}</div>` : ""}
      </button>`).join("")}</div>`;
    return `<p class="muted">Olá, Marina</p><h1 style="font-size:40px">Suas leituras</h1>
      ${next ? `<button class="nextbar estrelado" data-meeting="${next.id}">
        <div class="t"><div class="caps">Próximo encontro · ${rel(next.startsAt)}</div><h2>${esc(next.book.title)} — ${esc(next.title)}</h2><div class="ch">${esc(next.chapters)}</div><div class="when">${fLong(next.startsAt)}</div></div>
        ${pill(phase(next))}<span class="go">Ver encontro →</span></button>` : ""}
      ${current.length ? `<div class="sect"><h2 class="sect-h">Em andamento</h2>${grid(current)}</div>` : ""}
      ${finished.length ? `<div class="sect"><h2 class="sect-h">Leituras concluídas <small>Aulas gravadas</small></h2>${grid(finished)}</div>` : ""}
      ${upcoming.length ? `<div class="sect"><h2 class="sect-h">Próximas leituras conjuntas</h2>${grid(upcoming)}</div>` : ""}`;
  }
  function renderStudentBook(b) {
    const ms = b.meetings;
    const nextId = ms.find((m) => ["upcoming", "live"].includes(phase(m)))?.id;
    const done = ms.filter((m) => ["recorded", "processing"].includes(phase(m))).length;
    const total = ms.filter((m) => m.status !== "CANCELLED").length;
    const [label, cta] = SIGN[b.signup];
    return `<button class="crumb" data-st="home">← Todos os livros</button>
      ${b.id === "fausto" ? `<div class="manto ciclo-band"><svg viewBox="0 0 120 150" aria-hidden="true"><use href="#manto"/></svg><div><div class="k">Ciclo de estudos</div><div class="t">O Manto Mariano</div></div><div class="sig"><svg viewBox="0 0 160 124" style="--mbg:var(--manto);--mw:var(--velino);--mf:var(--ouro-manto)" aria-hidden="true"><use href="#marca"/></svg>Um ciclo da Academia Bocault</div></div>` : ""}
      <div class="bookhead"><div class="cv">${cover(b)}</div><div class="info">
        ${bookStatus(b)}<h1>${esc(b.title)}</h1><div class="au">${esc(b.author)}</div><p class="d">${esc(b.desc)}</p>
        ${b.edition ? `<p style="margin-top:12px;font-size:14px"><span class="muted">Edição usada:</span> ${esc(b.edition)}</p>` : ""}
        <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px">${b.enrolled ? b.files.map((f, i) => `<button class="btn${i ? " ghost" : ""}" data-toast="${f.type === "PDF" ? "Abre o PDF do livro no navegador." : "Baixa o arquivo do livro."} Só para quem tem acesso a esta leitura.">${f.type === "PDF" ? "Ler o PDF" : "Baixar " + f.type}</button>`).join("") : ""}<button class="btn ghost" data-toast="Abre a loja pelo link de afiliado da Academia.">Comprar o livro ↗</button></div>
        <div class="prog"><div class="row"><span>Progresso do grupo</span><span class="num">${done} de ${total} encontros</span></div><div class="track"><div class="fill" style="width:${total ? (done / total) * 100 : 0}%"></div></div>
          ${b.enrolled && done ? ((w) => `<div class="row" style="margin-top:12px"><span>Progresso individual</span><span class="num">${w} de ${done} aulas assistidas</span></div><div class="track"><div class="fill mine" style="width:${(w / done) * 100}%"></div></div>`)(ms.filter((m) => talk.watched.has(m.id)).length) : ""}</div>
        ${b.enrolled ? `<p class="muted" style="margin-top:14px;font-size:14px">Seu acesso às gravações vai até ${fYear(new Date(Date.now() + 340 * DAY))}.</p>`
          : `<div class="locked"><p>${b.signup === "RECORDINGS" ? `A leitura terminou, mas as ${b.meetings.filter((m) => m.recorded).length} aulas gravadas ficam disponíveis para quem assina.` : `Os links dos encontros e as gravações ficam liberados para quem participa desta leitura. ${label}.`}</p>${cta ? `<button class="btn" data-toast="Leva para a página de inscrição.">${cta}${b.signup === "OPEN" ? " · " + b.price : ""}</button>` : ""}</div>`}
      </div></div>
      <div class="sect"><h2>Encontros</h2><ol class="mlist">${ms.map((m, i) => {
        const p = parts(m.startsAt);
        return `<li><button class="mrow ${m.id === nextId ? "next" : ""} ${b.enrolled ? "" : "nolink"}" ${b.enrolled ? `data-meeting="${m.id}"` : `data-toast="Bloqueado até a inscrição."`} ${m.status === "CANCELLED" ? 'style="opacity:.6"' : ""}>
          <div class="rn roman">${roman(i + 1)}</div>
          <div class="body"><div class="k">${cap(p.wd)}, ${p.dd} ${p.mm} · ${fTime(m.startsAt)}</div><div class="n">${esc(m.title)}${talk.watched.has(m.id) ? '<span class="seen">✓ Assistida</span>' : ""}</div><div class="c">${esc(m.chapters)}</div></div>
          ${pill(phase(m))}<span class="${b.enrolled ? "" : "caps muted"}" style="${b.enrolled ? "color:var(--accent)" : "font-size:10px"}">${b.enrolled ? "→" : "Bloqueado"}</span></button></li>`;
      }).join("")}</ol></div>`;
  }
  function renderStudentMeeting(m) {
    const b = m.book, ms = b.meetings, i = ms.indexOf(m), p = phase(m);
    let body = "";
    if (p === "recorded") body = m.rec
      ? `<div class="player"><a class="play" href="${esc(m.rec)}" target="_blank" rel="noopener" aria-label="Assistir a gravação de ${esc(m.title)} no YouTube"></a>
      <div class="bar"><i></i></div><div class="cap"><span>${esc(m.book.title)} · ${esc(m.title)} · YouTube</span><span class="num">${Math.floor(m.duration / 60)}h${String(m.duration % 60).padStart(2, "0")}</span></div></div>
      <p class="muted" style="font-size:13px;margin-top:8px">Na plataforma o vídeo toca aqui dentro. Nesta demonstração ele abre no YouTube. Por enquanto são vídeos públicos do canal no lugar das gravações.</p>`
      : `<div class="player"><button class="play" aria-label="Assistir gravação" data-play></button><div class="bar"><i></i></div><div class="cap"><span>Gravação · ${esc(m.title)}</span></div></div>`;
    else if (p === "processing") body = `<div class="note muted">A gravação deste encontro está sendo preparada. Você recebe um e-mail assim que ela estiver disponível.</div>`;
    else if (p === "cancelled") body = `<div class="note muted">Este encontro foi cancelado.</div>`;
    else body = `<div class="livebox ${p === "live" ? "on" : "estrelado"}"><div class="s">${p === "live" ? "Acontecendo agora" : "Começa " + rel(m.startsAt)}</div><h2>Encontro ao vivo no Google Meet</h2>
      <div class="acts"><button class="primary" data-toast="Abre a sala do Google Meet deste encontro.">Entrar no Meet ↗</button><button data-toast="Abre o Google Agenda com o encontro preenchido.">Google Agenda</button><button data-toast="Baixa o convite .ics para qualquer agenda.">Baixar .ics</button></div></div>`;
    return `<button class="crumb" data-book="${b.id}">← ${esc(b.title)}</button>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px"><span class="caps muted">Encontro ${roman(i + 1)} de ${roman(ms.length)}</span>${pill(p)}</div>
      <h1 style="font-size:clamp(34px,6vw,46px);margin-top:6px">${esc(m.title)}</h1>
      <p class="muted" style="font-size:20px;margin-top:6px;font-style:italic">${esc(m.chapters)}</p>
      ${b.edition ? `<p class="muted" style="font-size:12px;margin-top:2px">Pela edição ${esc(b.edition)}</p>` : ""}
      <p style="font-size:14px;margin-top:6px">${fLong(m.startsAt)} · ${m.duration} min</p>
      ${body}
      ${p === "recorded" ? `<div class="watchrow"><button class="btn${talk.watched.has(m.id) ? "" : " ghost"}" data-watch="${m.id}">${talk.watched.has(m.id) ? "✓ Aula assistida" : "Marcar como assistida"}</button><span>${talk.watched.has(m.id) ? "Conta no seu progresso desta leitura." : "Marque quando terminar, para acompanhar seu progresso."}</span></div>` : ""}
      <div class="note"><p>Traga suas anotações e as passagens que mais te marcaram.</p></div>

  function planMeetings({ start, time, every, count, program }) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) return [];
    time = /^\d{2}:\d{2}$/.test(time) ? time : "20:00";
    const lines = program.split("\n").map((l) => l.trim()).filter(Boolean);
    const n = Math.min(Math.max(Math.floor(count) || 0, lines.length), 40);

    const title0 = (i) => (i === 0 ? "Aula de abertura" : i === n - 1 && n > 2 ? "Encerramento" : `Encontro ${i + 1}`);
    return Array.from({ length: n }, (_, i) => {
      const day = every === "month" ? new Date(Date.UTC(y, m - 1 + i, d)) : new Date(Date.UTC(y, m - 1, d) + i * Number(every) * DAY);

    });

        <div class="panel"><h2>Como chega</h2><div id="em-preview"></div></div>
      </div>
      <div class="panel" style="margin-top:16px"><h2>Histórico de envios</h2><div class="tbl"><table><thead><tr><th>Assunto</th><th>Tipo</th><th>Destinatários</th><th>Quando</th></tr></thead>
        <tbody>${outbox.map((o) => `<tr><td>${esc(o.subject)}</td><td>${o.kind}</td><td class="num">${o.count}</td><td style="white-space:nowrap" class="muted">${o.scheduled ? "agendado · " + fShort(o.when) + " " + fTime(o.when) : rel(o.when)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  function adminAuto() {
    return `${ph("Automações", "E-mails que saem sozinhos. Desligue um e veja a diferença ao remarcar um encontro.")}
      <div class="panel">${Object.entries(automations).map(([k, [on, label, help]]) => `<div class="toggle"><div class="t"><b>${label}</b><span>${help}</span></div>
        <button class="link" data-previewmail="${k}" style="font-size:12.5px">Ver e-mail</button>
        <button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-auto="${k}"></button></div>`).join("")}</div>
      <div class="panel" style="margin-top:16px"><h2>Liberação automática de acesso</h2><p class="muted" style="font-size:14px">Quando uma inscrição é paga pela plataforma de vendas (Hotmart, Kiwify…), a pessoa ganha acesso ao livro e recebe o convite por e-mail sem ninguém precisar fazer nada.</p></div>`;
  }

  // ───── e-mail templates (same copy as the real platform) ─────
  function mailHtml(kind, m, extra = {}) {
    m = m || books[2].meetings[4];
    const box = `<p>Olá, Bocós!</p><div class="box"><b>${esc(m.book.title)}, ${esc(m.title)}</b><br><i>${esc(m.chapters)}</i><br>${fLong(m.startsAt)}</div>`;
    const T = {
      newMeeting: ["Novo encontro: " + m.book.title, "Novo encontro marcado", box, "Ver detalhes"],
      reschedule: ["Mudança de horário: " + m.book.title, "O encontro mudou de horário", (extra.prev ? `<p class="muted"><s>${fLong(extra.prev)}</s></p>` : "") + box + "<p>Atualize sua agenda com o novo horário.</p>", "Ver encontro"],
      cancel: ["Encontro cancelado: " + m.book.title, "Encontro cancelado", box + "<p>Avisaremos assim que houver uma nova data.</p>", "Ver próximos encontros"],
      recording: ["Gravação disponível: " + m.book.title, "A gravação do encontro está no ar", `<p>Olá, Bocós!</p><p>Perdeu o encontro ou quer rever? A gravação de <b>${esc(m.title)}</b> (${esc(m.chapters)}) já está disponível.</p>`, "Assistir gravação"],
      rem24: ["Amanhã: " + m.book.title + " — " + m.title, "Nosso encontro é amanhã", box + `<p>Leitura para o encontro: ${esc(m.chapters)}.</p>`, "Entrar no Google Meet"],
      rem1: ["Começa em 1 hora: " + m.book.title, "Começamos em 1 hora", box, "Entrar no Google Meet"],
      live: ["Estamos ao vivo: " + m.book.title, "Começou! Estamos ao vivo", box, "Entrar agora"],
    }[kind];
    return mailShell(T[0], T[1], T[2], T[3]);
  }
  function mailShell(subject, heading, bodyHtml, cta, to = "marina.souza@exemplo.com") {
    return `<div class="mail"><div class="env"><span><b>De:</b> Academia Bocault &lt;leituras@academiabocault.com.br&gt;</span><span><b>Para:</b> ${to}</span><span><b>Assunto:</b> ${esc(subject)}</span></div>
      <div class="sheet"><span class="wm"><span class="a">ACADEMIA</span><span class="b">Bocault</span></span><h3>${esc(heading)}</h3>${bodyHtml}<span class="mbtn">${esc(cta)}</span><div class="sig">Tolle, lege.</div>
      <div class="ft">Você recebe este e-mail porque participa das leituras conjuntas da Academia Bocault. Preferências de e-mail</div></div></div>`;
  }
  const textToHtml = (t) => t.trim().split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
  function updatePreview() {
    const el = document.getElementById("em-preview"); if (!el) return;
    const subj = document.getElementById("em-subj").value || "(sem assunto)";
    const body = document.getElementById("em-body").value.replaceAll("{{nome}}", "Marina");
    el.innerHTML = mailShell(subj, subj, textToHtml(body || " "), "Abrir a área do aluno");
  }
  function showModal(html) {
    const md = document.getElementById("modal");
    md.innerHTML = `<div class="modal" data-closemodal><div class="in" role="dialog" aria-modal="true" aria-label="Prévia do e-mail"><div class="close"><button class="btn ghost small" data-closemodal>Fechar</button></div>${html}</div></div>`;
  }

  // ───── render + routing ─────
  function render() {
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    app.innerHTML = state.view === "publico" ? renderPublic() : state.view === "aluno" ? renderStudent() : renderAdmin();
    updatePreview();
    updatePlanPreview();
  }
  function go(view) {
    state.view = view;
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  const startHash = (location.hash || "").slice(1);
  if (["publico", "aluno", "admin"].includes(startHash)) state.view = startHash;

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, [data-closemodal]");
    if (!t) return;
    const d = t.dataset;
    if ("closemodal" in d && (e.target === t || t.tagName === "BUTTON")) { document.getElementById("modal").innerHTML = ""; return; }
    if (d.view) return go(d.view);
    if (d.go) return go(d.go);
    if (d.toast) return toast("Na plataforma: " + d.toast.charAt(0).toLowerCase() + d.toast.slice(1));
    if (d.st) { state.student = { screen: "home" }; render(); return window.scrollTo(0, 0); }
    if (d.book && state.view === "aluno") { state.student = { screen: "book", bookId: d.book }; render(); return window.scrollTo(0, 0); }
    if (d.meeting) { state.student = { screen: "meeting", meetingId: d.meeting }; render(); return window.scrollTo(0, 0); }
    if (d.talktab) { state.student.tab = d.talktab; render(); return; }
    if (d.watch) { talk.watched.has(d.watch) ? talk.watched.delete(d.watch) : talk.watched.add(d.watch); render(); return; }
    if (d.comment) {
      const body = document.getElementById("tk-body").value.trim();
      if (!body) return document.getElementById("tk-body").focus();
      (talk.comments[d.comment] = talk.comments[d.comment] || []).push({ name: "Marina Souza", body, when: new Date(), mine: true });
      render(); document.getElementById("talk").scrollIntoView({ block: "start" });
      return toast("Comentário publicado. Toda a turma desta leitura vê.");
    }
    if (d.delcomment !== undefined && state.student.meetingId) {
      talk.comments[state.student.meetingId].splice(Number(d.delcomment), 1);
      render(); return document.getElementById("talk").scrollIntoView({ block: "start" });
    }
    if (d.savenote) {
      talk.notes[d.savenote] = { body: document.getElementById("nt-body").value, when: new Date() };
      render(); document.getElementById("talk").scrollIntoView({ block: "start" });
      return toast("Anotações salvas. Só você vê.");
    }
    if ("play" in d) {
      const bar = t.parentElement.querySelector(".bar i"); bar.style.transition = "width 6s linear"; bar.style.width = "100%";
      return toast("Na plataforma: o vídeo do Google Drive toca aqui, sem sair da página.");
    }
    if (d.create) return createReading();
    if (t.id === "nv-cover-pick") return document.getElementById("nv-cover").click();
    if (d.tab) { state.admin.tab = d.tab; state.admin.editing = null; render(); window.scrollTo(0, 0); return; }
    if (d.edit) {
      if (d.editbook) { state.admin.tab = "encontros"; state.admin.bookId = d.editbook; }
      state.admin.editing = state.admin.editing === d.edit ? null : d.edit; render(); return;
    }
    if (d.save) {
      const m = findMeeting(d.save), n = enrolledIn(m.book.id).length;
      const notify = document.getElementById("ed-notify")?.checked;
      const whenEl = document.getElementById("ed-when"), recEl = document.getElementById("ed-rec");
      const msgs = [];
      if (whenEl && whenEl.value) {
        const nd = fromInput(whenEl.value);
        if (!isNaN(nd) && nd.getTime() !== m.startsAt.getTime()) {
          const prev = m.startsAt; m.startsAt = nd;
          if (notify && automations.reschedule[0]) { logMail("Mudança de horário", `Mudança de horário: ${m.book.title} — ${m.title}`, n); msgs.push(`aviso de novo horário enviado para ${n} pessoas`); state.lastResched = { id: m.id, prev }; }
          else msgs.push("horário alterado sem aviso");
        }
      }
      if (recEl && recEl.value.trim() && !m.recorded) {
        m.recorded = true; m.rec = recEl.value.trim();
        if (notify && automations.recording[0]) { logMail("Gravação", `Gravação disponível: ${m.book.title} — ${m.title}`, n); msgs.push(`aviso de gravação enviado para ${n} pessoas`); }
      }
      state.admin.editing = null; render();
      toast(msgs.length ? "Salvo: " + msgs.join("; ") + "." : "Encontro salvo.");
      if (state.lastResched && state.lastResched.id === m.id && msgs.some((x) => x.startsWith("aviso de novo"))) showModal(mailHtml("reschedule", m, { prev: state.lastResched.prev }));
      return;
    }
    if (d.cancel) {
      const m = findMeeting(d.cancel), n = enrolledIn(m.book.id).length;
      m.status = "CANCELLED";
      if (automations.cancel[0]) logMail("Cancelamento", `Encontro cancelado: ${m.book.title} — ${m.title}`, n);
      state.admin.editing = null; render();
      return toast(automations.cancel[0] ? `Encontro cancelado. ${n} pessoas avisadas.` : "Encontro cancelado (aviso desligado nas automações).");
    }
    if (d.restore) { const m = findMeeting(d.restore); m.status = "SCHEDULED"; state.admin.editing = null; render(); return toast("Encontro reativado."); }
    if (d.live) {
      const m = findMeeting(d.live), n = enrolledIn(m.book.id).length;
      logMail("Ao vivo", `Estamos ao vivo: ${m.book.title}`, n); render();
      toast(`“Estamos ao vivo” enviado para ${n} pessoas.`); return showModal(mailHtml("live", m));
    }
    if (d.renew) { const p = members[+d.renew]; p.expires = new Date(Date.now() + 365 * DAY); render(); return toast(`Acesso de ${p.name.split(" ")[0]} renovado por 12 meses.`); }
    if (d.resend) { const p = members[+d.resend]; logMail("Convite", "Seu acesso à Academia Bocault", 1); render(); return toast(`Convite reenviado para ${p.email}.`); }
    if (d.preset) {
      const p = PRESETS[+d.preset]; document.getElementById("em-subj").value = p[1]; document.getElementById("em-body").value = p[2]; return updatePreview();
    }
    if (t.id === "em-send") {
      const to = document.getElementById("em-to").value, subj = document.getElementById("em-subj").value.trim(), body = document.getElementById("em-body").value.trim();
      if (!subj || !body) return toast("Preencha assunto e mensagem para enviar.");
      const n = to === "all" ? members.length : enrolledIn(to).length;
      const sched = document.getElementById("em-sched").checked;
      if (sched) {
        const w = fromInput(document.getElementById("em-when").value);
        logMail("Comunicado", subj, n); outbox[0].when = w; outbox[0].scheduled = true; render();
        return toast(`Agendado para ${fShort(w)} às ${fTime(w)}. Sai sozinho, para ${n} pessoas.`);
      }
      logMail("Comunicado", subj, n); render();
      return toast(`Enviado para ${n} pessoas, uma cópia para cada.`);
    }
    if (t.id === "up-pick") return document.getElementById("up-input").click();
    if (d.auto) { const a = automations[d.auto]; a[0] = !a[0]; render(); return toast(`${a[1]}: ${a[0] ? "ligado" : "desligado"}.`); }
    if (d.previewmail) return showModal(mailHtml(d.previewmail));
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "bookpick") { state.admin.bookId = e.target.value; state.admin.editing = null; render(); }
    if (e.target.id === "nv-every") updatePlanPreview();
    if (e.target.id === "nv-cover" && e.target.files[0]) {
      const r = new FileReader();
      r.onload = () => { novaCover = r.result; document.getElementById("nv-cover-pv").innerHTML = `<img src="${novaCover}" alt="Capa escolhida">`; };
      r.readAsDataURL(e.target.files[0]);
    }
    if (e.target.id === "up-input" && e.target.files.length) {
      const b = byId(state.admin.bookId), files = [...e.target.files];
      const box = document.getElementById("up-progress");
      box.innerHTML = files.map((f, i) => `<div style="margin-top:10px;font-size:13px"><div style="display:flex;justify-content:space-between;gap:10px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><span class="muted num" id="up-pct-${i}">0%</span></div><div class="upbar"><i id="up-bar-${i}"></i></div></div>`).join("");
      let p = 0;
      const tick = setInterval(() => {
        p = Math.min(100, p + 7);
        files.forEach((_, i) => { document.getElementById("up-bar-" + i).style.width = p + "%"; document.getElementById("up-pct-" + i).textContent = p + "%"; });
        if (p >= 100) {
          clearInterval(tick);
          files.forEach((f) => b.files.push({ name: f.name, size: f.size, type: (f.name.split(".").pop() || "").toUpperCase().replace("AZW3", "Kindle").replace("MOBI", "Kindle") }));
          render();
          toast(`${files.length} arquivo(s) enviado(s). Só alunos de ${b.title} conseguem abrir.`);
        }
      }, 60);
    }
    if (e.target.id === "em-sched") {
      document.getElementById("em-when-wrap").hidden = !e.target.checked;
      document.getElementById("em-send").textContent = e.target.checked ? "Agendar e-mail" : "Enviar agora";
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "em-subj" || e.target.id === "em-body") updatePreview();
    if (/^nv-(start|time|count|prog)$/.test(e.target.id)) updatePlanPreview();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("modal").innerHTML = ""; });

  render();
})();
</script>

</body>
